apiVersion: v1
kind: Service
metadata:
  name: cassandra-rack1-0
  namespace: sd
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    # Tira o IP da subnet dedicada snet-lb (e não da subnet dos nós).
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "snet-lb"
    # IP privado FIXO. A anotação é a forma atual; spec.loadBalancerIP abaixo é
    # o campo legado, mantido com o mesmo valor por compatibilidade.
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "10.10.32.10"
spec:
  loadBalancerIP: "10.10.32.10"
---
