# Overlay do dc2 — aplicado no cluster AKS de eastus.
#
# dc2 ENTRA num cluster que ja existe: sobe com auto_bootstrap=false
#   e recebe os dados depois via `nodetool rebuild -- dc1` (make mdc-rebuild).
#   Depois do rebuild concluido, troque para "true" e reaplique, senao um pod
#   recriado no futuro subiria vazio e sem streamar.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - configmap-topology.yaml

patches:
  - path: patch-statefulset-rack1.yaml
  - path: patch-statefulset-rack2.yaml
  - path: patch-loadgen.yaml
  # arquivo multi-documento: casa com os 3 Services pelo nome/kind
  - path: patch-services-lb.yaml
