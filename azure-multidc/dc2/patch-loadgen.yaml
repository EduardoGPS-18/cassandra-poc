# O driver fala só com o DC local (DCAwareRoundRobin): as escritas confirmam
# em dc2 sem esperar a outra região.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: sd
spec:
  # Fica PARADO por padrão: a carga do cluster é gerada por uma instância só,
  # no dc1. Ligue este aqui apenas para a demo de QUEDA DE REGIÃO, quando você
  # precisa provar que o dc2 continua servindo sozinho:
  #     make mdc-loadgen-dc2-on     (e ...-off para desligar)
  replicas: 0
  template:
    spec:
      # A aplicação vai para a ZONA 3, onde mora só o rack2 (1 nó). No dc2 as
      # zonas disponíveis são 2 e 3 (a 1 é barrada para esta subscription), e é
      # a zona 2 que concentra os 2 nós do rack1. Como o NetworkTopologyStrategy
      # distribui as réplicas em rodízio entre os racks, a zona 2 carrega 2 das
      # 3 cópias de cada partição — é a mais ocupada. Deixar o gerador de carga
      # fora dela evita disputa de CPU onde o Cassandra mais trabalha.
      #
      # Atenção ao trocar de região: o número da zona muda junto. No dc1 o
      # equivalente é chilecentral-2, porque lá as zonas são 1 e 2.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["mexicocentral-3"]
      containers:
        - name: loadgen
          env:
            - name: LOCAL_DC
              value: "dc2"
