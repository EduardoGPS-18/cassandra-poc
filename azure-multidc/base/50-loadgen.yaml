# Um gerador de carga POR DC. Cada um escreve no seu próprio DC com
# LOCAL_QUORUM — ou seja, a escrita confirma com 2 das 3 réplicas locais e NÃO
# espera a travessia Brasil<->EUA. A replicação para o outro DC acontece em
# background; é isso que torna multi-DC viável com ~120ms entre as regiões.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: sd
  labels:
    app: loadgen
spec:
  replicas: 1
  # Recreate em vez de RollingUpdate: mata o pod velho ANTES de criar o novo.
  #
  # O rolling update padrão quer os dois de pé ao mesmo tempo (maxSurge=1,
  # maxUnavailable=0). Como o nodeAffinity prende esta aplicação a uma zona que
  # tem UM nó só — e esse nó já hospeda um Cassandra —, não há CPU para dois
  # loadgens simultâneos: o pod novo fica Pending com "Insufficient cpu" e o
  # rollout trava para sempre.
  #
  # Gerador de carga não precisa de rollout sem downtime: alguns segundos sem
  # carga entre uma versão e outra não custam nada.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: loadgen
          image: tp01-loadgen
          imagePullPolicy: Always
          env:
            - name: CONTACT_POINTS
              value: "cassandra-client.sd.svc.cluster.local"
            - name: KEYSPACE
              value: "sd_demo"
            # LOCAL_DC é injetado pelo overlay: é o que faz o driver falar só
            # com o DC local (TokenAware + DCAwareRoundRobin).
            - name: CONSISTENCY
              value: "LOCAL_QUORUM"
            # 4, nao 32: as VMs sao burstable e martelar o Cassandra esgotaria
            # o credito de CPU no meio da demo. Tambem reduz o trafego replicado
            # entre as regioes, que e o item mais caro da conta.
            - name: CONCURRENCY
              value: "4"
            # Mix das 4 operacoes, pesos normalizados. 25% cada.
            # UPDATE/DELETE precisam de linhas existentes: o loadgen mantem um
            # pool das PKs recem-inseridas para servirem de alvo.
            - name: OP_MIX
              value: "insert=25,read=25,update=25,delete=25"
            - name: BUCKETS
              value: "64"
            - name: REPORT_INTERVAL
              value: "2.0"
            - name: EMIT_LAT_SAMPLES
              value: "1"
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
