# Service HEADLESS (clusterIP: None) — dá a cada pod um DNS estável:
#   cassandra-0.cassandra.sd.svc.cluster.local, cassandra-1..., etc.
# É por esses nomes que os nós se enxergam via gossip e que definimos os SEEDS.
# Não faz load balancing; existe só para descoberta/identidade estável.
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: sd
  labels:
    app: cassandra
spec:
  clusterIP: None
  # publishNotReadyAddresses garante que o DNS do seed resolva ANTES do pod
  # ficar "Ready", senão o primeiro nó nunca consegue formar o cluster.
  publishNotReadyAddresses: true
  selector:
    app: cassandra
  ports:
    - name: intra-node       # gossip entre nós
      port: 7000
    - name: jmx              # nodetool / métricas
      port: 7199
    - name: cql              # driver da aplicação
      port: 9042
